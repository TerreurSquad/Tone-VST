name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create GitHub Releases on tags

jobs:
  dsp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7            # submodules not needed for the DSP core
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DXTONE_BUILD_PLUGIN=OFF
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  windows:
    needs: dsp-tests
    runs-on: windows-latest                  # fallback on toolchain trouble: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: DSP tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $vst = (Resolve-Path "build/Xtone_artefacts/Release/VST3/XTONE.vst3").Path
          # pluginval.exe is a GUI-subsystem app: a direct call neither waits nor sets $LASTEXITCODE.
          $p = Start-Process -FilePath "./pluginval/pluginval.exe" `
                 -ArgumentList "--strictness-level", "5", "--skip-gui-tests", "--validate", "`"$vst`"" `
                 -Wait -PassThru -NoNewWindow -RedirectStandardOutput pluginval.log
          Get-Content pluginval.log
          $log = Get-Content pluginval.log -Raw
          Write-Host "pluginval exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0 -or $log -notmatch "SUCCESS" -or $log -match "FAILED") { exit 1 }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build/Xtone_artefacts/Release/VST3/XTONE.vst3" dist/
          Copy-Item "build/Xtone_artefacts/Release/Standalone/XTONE.exe" dist/
          Copy-Item README.md dist/
          New-Item -ItemType Directory -Force dist/docs | Out-Null
          Copy-Item docs/HANDOFF.md, docs/DECISIONS.md dist/docs/
          Copy-Item -Recurse docs/screenshots dist/docs/
          Compress-Archive -Path dist/* -DestinationPath XTONE-win64.zip -Force
      - uses: actions/upload-artifact@v7
        with:
          name: XTONE-win64
          path: dist/          # artifact zip contains XTONE.vst3 + XTONE.exe directly
      - name: GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: XTONE-win64.zip
          prerelease: ${{ contains(github.ref, '-') || startsWith(github.ref, 'refs/tags/v0.') }}
